[project]
name = "picture-analysis"
version = "0.1.0"
description = "规范化图片索引数据库 + 本地 Web 管理界面"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pillow>=10.4",
    "numpy>=1.26",
    "jieba>=0.42",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["release", "frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入惯用法：Body()/Query()/File() 必须写在参数默认值里
"app/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "server.py", "scripts"]

[[tool.mypy.overrides]]
module = ["jieba.*", "PIL.*", "PIL.Image.*", "PIL.ExifTags.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 耗时较长的用例",
    "e2e: 浏览器端到端（默认跳过）",
    "perf: 性能基准（默认不跑）",
]
addopts = "-q --durations=5 -m 'not perf and not e2e'"

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]
